<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){
  var KEY='benchtools-theme', root=document.documentElement,
      mq=window.matchMedia('(prefers-color-scheme: light)');
  function stored(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function label(){
    var light=root.getAttribute('data-theme')==='light',
        b=document.querySelectorAll('[data-theme-toggle]');
    for(var i=0;i<b.length;i++){
      b[i].textContent = light ? 'Dark' : 'Light';
      b[i].title = light ? 'Switch to the dark theme' : 'Switch to the light theme';
      b[i].setAttribute('aria-label', b[i].title);
    }
  }
  function apply(){
    var s=stored();
    root.setAttribute('data-theme', s==='light'||s==='dark' ? s : (mq.matches ? 'light' : 'dark'));
    label();
  }
  apply();
  if(mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if(e.key===KEY) apply(); });
  document.addEventListener('click', function(e){
    if(!e.target.closest || !e.target.closest('[data-theme-toggle]')) return;
    var next = root.getAttribute('data-theme')==='light' ? 'dark' : 'light';
    try{ localStorage.setItem(KEY, next); }catch(err){}
    root.setAttribute('data-theme', next); label();
  });
  document.addEventListener('DOMContentLoaded', label);
})();</script>
<title>PrimerBench — BenchTools</title>
<style>
:root{
  --paper:#0c0e12; --surface:#1b2027; --ink:#dfe4ea; --body:#c4ccd6; --muted:#8e99a8;
  --line:#2c333d; --accent:#ff9d3d;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#f4f6f8; --surface:#ffffff; --ink:#131c25; --body:#31404e; --muted:#5b6977;
  --line:#d6dde4; --accent:#a44d00; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;font-family:var(--sans);color:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
.bt-head{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0}
.bt-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bt-brand{font-size:14px;text-decoration:none;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.bt-brand span{color:var(--muted);font-weight:400}
.bt-brand:hover span{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--body);padding:6px 11px;border-radius:6px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--paper);border-color:var(--muted)}
.bt-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.bt-foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.bt-foot a{color:var(--accent);text-decoration:none}
.bt-foot a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</head>
<body>
<header class="bt-head">
  <div class="wrap">
    <a class="bt-brand" href="index.html">Bench&nbsp;Tools <span>/ lab utilities</span></a>
    <button class="btn" type="button" data-theme-toggle>Light</button>
  </div>
</header>

<div id="root"></div>

<footer class="bt-foot">
  <div class="wrap">
    <div>BenchTools &middot; runs entirely in your browser</div>
    <div><a href="https://github.com/omidalam/benchtools">Source on GitHub</a></div>
  </div>
</footer>

/* Dark is the default (BenchTools is dark-first); light overrides below are
   keyed on the site-wide data-theme attribute the shared toggle sets.
   All variables are scoped to .app so they never collide with the site chrome. */
.app{
  --paper:#0c0e12; --panel:#1b2027; --panel-2:#161b22;
  --ink:#dfe4ea; --muted:#8e99a8; --line:#2c333d; --line-strong:#3a424d;
  --primary:#2bb8a6; --primary-deep:#86e4d6; --primary-soft:#123a35;
  --amber:#e0a44d; --amber-soft:#3a2d18; --red:#e4746c; --red-soft:#3a2020; --green:#5cc083;
  --bA:#56c77a; --bC:#5aa0ef; --bG:#c3ccd6; --bT:#f0776f;
  --exon-alt:#17433c; --revbtn-hover:#18534b; --minus-bg:#262d44; --minus-text:#a9b6e0; --amberhi:#3a2d18;
  font-family:${fm};
  color:var(--ink); background:transparent; padding:0 0 40px;
}
:root[data-theme="light"] .app{
  --paper:#EAEDE8; --panel:#FBFCFA; --panel-2:#F2F4F0;
  --ink:#171B1A; --muted:#5A6360; --line:#DBE0D9; --line-strong:#C3CABF;
  --primary:#0B7A6E; --primary-deep:#075048; --primary-soft:#D6ECE8;
  --amber:#9A5B00; --amber-soft:#F6E7CC; --red:#B23A3A; --red-soft:#F3D9D6; --green:#2F7D4E;
  --bA:#2E7D46; --bC:#215FA6; --bG:#3A3F45; --bT:#C0403A;
  --exon-alt:#CDE8E2; --revbtn-hover:#C3E6E0; --minus-bg:#E4E7F5; --minus-text:#3B4A7A; --amberhi:#F3E2CE;
}
*{box-sizing:border-box;}
.app *{scrollbar-width:thin;}

/* Topbar */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  padding:18px 26px; background:var(--panel); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:12px;}
.mark{width:40px;height:40px;border:1px solid var(--line-strong);border-radius:10px;display:grid;place-items:center;background:var(--panel);}
.title{font-weight:700;font-size:19px;letter-spacing:-0.02em;}
.subtitle{font-size:11.5px;color:var(--muted);letter-spacing:0.02em;text-transform:lowercase;}
.conditions{display:flex;gap:8px;flex-wrap:wrap;}
.condfield{display:flex;flex-direction:column;gap:3px;}
.cond-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:600;}
.cond-unit{color:var(--line-strong);}
.cond-input{
  width:74px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:13px;font-weight:600;
  padding:6px 8px;border:1px solid var(--line-strong);border-radius:7px;background:var(--panel);color:var(--ink);
}
.cond-input:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}

/* Tabs */
.tabs{display:flex;gap:4px;padding:16px 26px 0;max-width:1120px;margin:0 auto;}
.tab{
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-0.01em;
  padding:10px 18px;border:none;background:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--primary-deep);border-bottom-color:var(--primary);}
.tab:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;}

/* Content */
.content{max-width:1120px;margin:0 auto;padding:18px 26px;}
.tabbody{display:flex;flex-direction:column;gap:18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.panel-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--primary-deep);margin-bottom:10px;}
.section-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--muted);margin:4px 2px -2px;}
.section-eyebrow.flat{margin:0;}
.section-eyebrow.mt{margin-top:14px;}

.seqinput{
  width:100%;min-height:64px;resize:vertical;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:14px;line-height:1.5;letter-spacing:0.06em;
  padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel-2);color:var(--ink);
}
.seqinput:focus-visible{outline:2px solid var(--primary);outline-offset:1px;background:var(--panel);}

.seqline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 2px;}
.tick{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:11px;color:var(--muted);font-weight:600;}
.seqbases{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:14px;letter-spacing:0.12em;word-break:break-all;}
.seqcap{font-size:11px;color:var(--muted);margin-left:6px;}
.bA{color:var(--bA);} .bC{color:var(--bC);} .bG{color:var(--bG);} .bT{color:var(--bT);}

.metricrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
.metricrow.four{grid-template-columns:repeat(4,1fr);}
@media(max-width:520px){.metricrow{grid-template-columns:repeat(2,1fr);}}
.readout{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
.ro-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);font-weight:600;white-space:nowrap;}
.ro-value{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-top:2px;}
.ro-unit{font-size:11px;color:var(--muted);font-weight:400;}
.ro-primary{color:var(--primary-deep);}
.ro-alert{color:var(--red);}
.ro-ok{color:var(--green);}

/* Ta banner */
.ta-banner{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  background:var(--primary-soft);border:1px solid var(--primary);border-radius:12px;padding:12px 18px;
}
.ta-label{font-size:12px;font-weight:600;color:var(--primary-deep);}
.ta-value{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:24px;font-weight:700;color:var(--primary-deep);}
.ta-note{font-size:11px;color:var(--primary-deep);opacity:.8;}

/* Dimer cards */
.dimercard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
.dimerhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.dimertitle{font-size:12.5px;font-weight:600;}
.align{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12.5px;line-height:1.35;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink);margin:0 0 10px;
}
.dimerstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;}
.dimerstats .ro-value{font-size:16px;}

/* Copy buttons + selection bar */
.copybtn{
  font-family:inherit;font-size:11.5px;font-weight:600;color:var(--primary-deep);
  background:var(--panel);border:1px solid var(--primary);border-radius:7px;
  padding:6px 11px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;
}
.copybtn:hover{background:var(--primary-soft);}
.copybtn.copied{background:var(--primary);color:#fff;border-color:var(--primary);}
.copybtn:disabled{opacity:.4;cursor:default;border-color:var(--line-strong);color:var(--muted);}
.copybtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.selinfo{font-size:12px;color:var(--muted);margin-right:auto;}
.selinfo strong{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;color:var(--primary-deep);}
.framecopy{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
.sectionnote{font-size:11.5px;color:var(--muted);margin:2px 2px 0;line-height:1.5;}

/* About tab */
.about{max-width:820px;}
.about p{font-size:13.5px;line-height:1.65;margin:0 0 10px;color:var(--ink);}
.about p:last-child{margin-bottom:0;}
.abouthero{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:14px;padding:22px 24px;}
.abouttitle{font-size:26px;font-weight:700;letter-spacing:-0.03em;margin:0 0 8px;}
.aboutlede{font-size:14.5px !important;line-height:1.6 !important;color:var(--muted) !important;max-width:62ch;}
.aboutlinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.abtn{font-size:12.5px;font-weight:600;text-decoration:none;padding:8px 15px;border-radius:8px;background:var(--primary);color:#fff;border:1px solid var(--primary);transition:opacity .15s;}
.abtn:hover{opacity:.88;}
.abtn.ghost{background:transparent;color:var(--primary-deep);}
.abtn.ghost:hover{background:var(--primary-soft);opacity:1;}
.abtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.aboutsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;}
.abouth{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--primary-deep);margin-bottom:9px;}
.aboutgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:760px){.aboutgrid{grid-template-columns:1fr;}}
.aboutcard{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:14px 15px;}
.aboutcard p{font-size:12.5px !important;line-height:1.6 !important;color:var(--muted) !important;margin:0 !important;}
.acnum{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:10.5px;color:var(--line-strong);font-weight:700;letter-spacing:0.08em;}
.acnote{margin-top:10px !important;padding-top:9px;border-top:1px dashed var(--line-strong);color:var(--ink) !important;}
.acnote strong{color:var(--primary-deep);}
.acname{font-size:14px;font-weight:700;margin:2px 0 7px;letter-spacing:-0.01em;}
.callout{background:var(--primary-soft);border:1px solid var(--primary);border-radius:14px;padding:18px 22px;}
.callout.warn{background:var(--amber-soft);border-color:var(--amber);}
.callout.warn .abouth{color:var(--amber);}
.aboutlist{margin:0;padding-left:18px;}
.aboutlist li{font-size:13px;line-height:1.65;margin-bottom:9px;}
.aboutlist li:last-child{margin-bottom:0;}
.aboutlist strong{color:var(--primary-deep);}
.cmdrow{display:flex;align-items:flex-start;gap:10px;margin:4px 0 10px;}
.cmd{flex:1;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12.5px;line-height:1.7;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:0;overflow-x:auto;color:var(--ink);}
.aboutfoot{display:flex;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:2px 4px;}
.dot{color:var(--line-strong);}

.chip{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.chip-ok{background:var(--primary-soft);color:var(--primary-deep);}
.chip-warn{background:var(--amber-soft);color:var(--amber);}
.chip-alert{background:var(--red-soft);color:var(--red);}

.warnline{font-size:12px;color:var(--red);margin:8px 0 0;font-weight:500;}
.okline{font-size:12px;color:var(--green);margin:8px 0 0;font-weight:500;}
.muted{color:var(--muted);} .small{font-size:12px;}

/* Scanner */
.lenhint{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12px;color:var(--ink);margin-top:8px;}
.seqtools{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;}
.seqtools .lenhint{margin-top:0;}
.revbtn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--primary-deep);background:var(--primary-soft);border:1px solid var(--primary);border-radius:8px;padding:7px 13px;cursor:pointer;transition:background .15s;}
.revbtn:hover{background:var(--revbtn-hover);}
.revbtn:disabled{opacity:.45;cursor:default;}
.revbtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.seqviewer{cursor:crosshair;user-select:none;touch-action:none;padding:6px 2px;}
.seqviewer:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px;}
.seqrow{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.gutter{flex:0 0 auto;width:38px;text-align:right;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:11px;color:var(--muted);user-select:none;}
.rowbases{display:flex;}
.vbase{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:26px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:15px;font-weight:500;transition:opacity .1s;
}
.vbase.outsel{opacity:.3;}
.vbase.insel{opacity:1;font-weight:700;background:var(--primary-soft);border-top:1.5px solid var(--primary);border-bottom:1.5px solid var(--primary);}
.vbase.selstart{border-left:2px solid var(--primary);border-top-left-radius:6px;border-bottom-left-radius:6px;}
.vbase.selend{border-right:2px solid var(--primary);border-top-right-radius:6px;border-bottom-right-radius:6px;}

.sliders{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.sliderrow{display:flex;align-items:center;gap:12px;}
.sliderrow>span{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;width:64px;}
.sliderrow input[type=range]{flex:1;accent-color:var(--primary);height:4px;}
.numin{width:66px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:13px;font-weight:600;padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel-2);color:var(--ink);}
.numin:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}

.live{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.livehead{display:flex;align-items:center;justify-content:space-between;}
.livepos{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12px;color:var(--primary-deep);font-weight:600;}

.foot{max-width:1120px;margin:20px auto 0;padding:0 26px;font-size:11px;color:var(--muted);line-height:1.6;}

/* Amplify tab */
.seqinput.tall{min-height:104px;}
.stringency{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
.strlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--primary-deep);}
.strfield{display:flex;align-items:center;gap:8px;}
.strfield>span{font-size:11.5px;color:var(--muted);font-weight:600;}
.strnote{font-size:11px;color:var(--muted);flex:1;min-width:200px;}

.verdict{border-radius:12px;padding:14px 18px;border:1px solid;}
.v-ok{background:var(--primary-soft);border-color:var(--primary);}
.v-warn{background:var(--amber-soft);border-color:var(--amber);}
.v-alert{background:var(--red-soft);border-color:var(--red);}
.v-idle{background:var(--panel-2);border-color:var(--line-strong);}
.verdicthead{font-size:17px;font-weight:700;letter-spacing:-0.01em;}
.v-ok .verdicthead{color:var(--primary-deep);} .v-warn .verdicthead{color:var(--amber);} .v-alert .verdicthead{color:var(--red);} .v-idle .verdicthead{color:var(--muted);}
.verdictsub{font-size:12.5px;margin-top:4px;line-height:1.5;color:var(--ink);opacity:.85;}
.verdictta{font-size:12.5px;margin-top:8px;color:var(--primary-deep);}
.verdictta strong{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:15px;}

.siterow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px;}
.siterow:last-child{border-bottom:none;}
.strandtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.st-p{background:var(--primary-soft);color:var(--primary-deep);}
.st-m{background:var(--minus-bg);color:var(--minus-text);}
.sitepos{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-weight:600;}
.sitemeta{color:var(--muted);}
.warntext{color:var(--amber);font-weight:600;}

.prodcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
.prodhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;cursor:pointer;}
.prodsize{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:19px;font-weight:700;color:var(--primary-deep);}
.prodrange,.prodpair{font-size:12px;color:var(--muted);}
.prodtoggle{margin-left:auto;font-size:11px;color:var(--primary);font-weight:600;}
.ampseq{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12.5px;line-height:1.7;word-break:break-all;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;
}
.ampF{background:var(--primary-soft);color:var(--primary-deep);font-weight:700;}
.ampR{background:var(--amberhi);color:var(--amber);font-weight:700;}

/* Translation viewer */
.coding{margin-top:12px;}
.framebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-bottom:10px;}
.framelabel{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;font-weight:700;color:var(--primary-deep);}
.frameslider{flex:0 1 190px;accent-color:var(--primary);height:4px;}
.framevalue{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:15px;font-weight:700;color:var(--primary-deep);min-width:28px;}
.framestats{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.framecleartag{background:var(--primary-soft);color:var(--primary-deep);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:2px 7px;border-radius:20px;}
.cvbody{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 8px;overflow-x:auto;}
.cvrow{margin-bottom:7px;}
.cvrow:last-child{margin-bottom:0;}
.cvline{display:flex;align-items:center;white-space:nowrap;}
.cvgutter{flex:0 0 auto;width:40px;text-align:right;padding-right:6px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:10px;color:var(--muted);user-select:none;}
.cvaa,.cvbase{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;}
.cvaa{font-size:11.5px;font-weight:700;color:var(--primary-deep);height:15px;}
.aastop{color:var(--red);}
.aamet{color:var(--green);}
.cvbase{font-size:12px;height:19px;color:var(--ink);}
.codonstart{box-shadow:inset 1px 0 0 var(--line-strong);}
.protbox{margin-top:10px;}
.protbox summary{font-size:11.5px;color:var(--primary-deep);font-weight:600;cursor:pointer;}
.protseq{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12px;line-height:1.7;word-break:break-all;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:7px;letter-spacing:0.06em;}
.prodbody{font-size:12px;color:var(--muted);}
.ellip{color:var(--muted);font-style:italic;}
.amplegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;align-items:center;}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.swmid{background:var(--line-strong);}

.checkrow{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
.checkrow:last-child{border-bottom:none;}
.checkmark{flex:0 0 auto;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.cm-ok{background:var(--primary-soft);color:var(--primary-deep);}
.cm-warn{background:var(--amber-soft);color:var(--amber);}
.cm-bad{background:var(--red-soft);color:var(--red);}
.checklabel{font-weight:600;min-width:118px;}
.checkdetail{color:var(--muted);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:11.5px;}

/* qPCR tab */
.qpcrparsed{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.qpcrstat{font-size:12px;color:var(--muted);}
.qpcrstat strong{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;color:var(--primary-deep);font-size:14px;}
.qpcrparsed .copybtn{margin-left:auto;}
.genepanel{overflow-x:auto;}
.genesvg{width:100%;min-width:560px;height:auto;display:block;}
.gsvlabel{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;fill:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
.gsvexon{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:12px;font-weight:700;fill:var(--primary-deep);}
.gsvintron{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:9px;fill:var(--muted);}
.gsvamp{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;font-size:11px;font-weight:600;fill:var(--ink);}
.genekey{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;align-items:center;}
.keyexon{background:var(--primary-soft);border:1px solid var(--primary);}
.keyintron{background:var(--line-strong);height:3px;border-radius:2px;}
.junctxt{color:var(--primary-deep);font-weight:700;}
.qprodnote{font-size:12.5px;line-height:1.5;color:var(--ink);opacity:.9;margin-top:8px;}
.qprodflags{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.qflag{font-size:11.5px;color:var(--muted);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;}
.qflag.on{color:var(--primary-deep);font-weight:600;}
.prodhead.static{cursor:default;}

@media(prefers-reduced-motion:reduce){*{transition:none !important;}}
